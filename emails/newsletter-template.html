<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .wrapper {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    .header {
      text-align: center;
      padding: 30px 0 20px;
    }
    .header h1 {
      font-size: 24px;
      color: #1a1a1a;
      margin: 0;
    }
    .header p {
      font-size: 14px;
      color: #666;
      margin: 5px 0 0;
    }
    .content {
      background: #ffffff;
      border-radius: 8px;
      padding: 30px;
      line-height: 1.6;
      color: #333;
    }
    .content h2 {
      font-size: 20px;
      color: #1a1a1a;
      margin: 30px 0 10px;
    }
    .content p {
      margin: 10px 0;
    }
    .content a {
      color: #14b8a6;
      text-decoration: underline;
    }
    .article-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }
    .article-card h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    .article-card h3 a {
      color: #1a1a1a;
      text-decoration: none;
    }
    .article-card h3 a:hover {
      color: #14b8a6;
    }
    .article-card p {
      font-size: 14px;
      color: #666;
      margin: 0;
    }
    .footer {
      text-align: center;
      padding: 20px 0;
      font-size: 12px;
      color: #999;
    }
    .footer a {
      color: #999;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>{{TITLE}}</h1>
      <p>{{DATE}}</p>
    </div>
    <div class="content">
      {{BODY}}
    </div>
    <div class="footer">
      <p>You're receiving this because you subscribed to {{BLOG_NAME}}.</p>
      <p><a href="{{UNSUBSCRIBE_URL}}">Unsubscribe</a> · <a href="{{ARCHIVE_URL}}">View in browser</a></p>
    </div>
  </div>
</body>
</html>
